name: Deploy Report Generator to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ec2-user
          key: ${{ secrets.AWS_KEY }}
          script: |
            cd ~/report-generator
            git pull
            docker build -t report-generator .
            docker stop report-generator || true
            docker rm report-generator || true
            docker run -d --env-file .env -p 8001:8000 --name report-generator report-generator